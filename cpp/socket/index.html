<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아두이노 센서 데이터 모니터링</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --border-color: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid var(--primary-color);
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #7f8c8d;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        .table-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .table-container h2 {
            margin: 0;
            font-size: 18px;
            color: #2c3e50;
        }
        .toggle-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
        }
        .toggle-btn:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 600;
        }
        tr:hover {
            background-color: #fdfdfd;
        }
        .hidden-row {
            display: none;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-on { background-color: #2ecc71; color: white; }
        .badge-off { background-color: #95a5a6; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 센서 스트림 실시간 대시보드</h1>

    <div class="dashboard-grid">
        <div class="card" style="border-top-color: #e74c3c;">
            <h3>🌡️ 온도 (Temperature)</h3>
            <div class="value" id="latest-temp">- °C</div>
        </div>
        <div class="card" style="border-top-color: #3498db;">
            <h3>💧 습도 (Humidity)</h3>
            <div class="value" id="latest-humi">- %</div>
        </div>
        <div class="card" style="border-top-color: #f1c40f;">
            <h3>☀️ 조도 (CDS)</h3>
            <div class="value" id="latest-cds">-</div>
        </div>
        <div class="card" style="border-top-color: #9b59b6;">
            <h3>💨 가스 (Gas)</h3>
            <div class="value" id="latest-gas">-</div>
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h2>📋 전체 수신 데이터 로그 (최신순)</h2>
            <button id="toggle-list-btn" class="toggle-btn" onclick="toggleListVisibility()">전체 보기</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>장치 ID</th>
                    <th>가동시간 (Uptime)</th>
                    <th>전압 (VCC)</th>
                    <th>온도</th>
                    <th>습도</th>
                    <th>조도</th>
                    <th>가스</th>
                    <th>LED</th>
                    <th>릴레이</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
                <!-- 자바스크립트로 데이터가 삽입되는 공간 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let masterDataArray = []; 
    let lastProcessedKey = null; 
    let isExpanded = false; 

    window.addEventListener('DOMContentLoaded', () => {
        loadJsonLogFile();
        setInterval(loadJsonLogFile, 10000);
    });

    function loadJsonLogFile() {
        fetch('data_log.json?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error("파일을 읽을 수 없습니다.");
                return response.text();
            })
            .then(rawText => {
                const lines = rawText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                let newItems = [];

                lines.forEach((line) => {
                    try {
                        const jsonObject = JSON.parse(line);
                        const currentKey = `${jsonObject.device_id}_${jsonObject.uptime}`;
                        newItems.push({ key: currentKey, data: jsonObject });
                    } catch (e) {
                        // 파싱 오류 줄 무시
                    }
                });

                if (newItems.length === 0) return;

                let itemsToAppend = [];
                
                if (lastProcessedKey === null) {
                    itemsToAppend = newItems;
                } else {
                    const lastIndex = newItems.findIndex(item => item.key === lastProcessedKey);
                    if (lastIndex !== -1) {
                        itemsToAppend = newItems.slice(lastIndex + 1);
                    } else {
                        itemsToAppend = newItems;
                    }
                }

                if (itemsToAppend.length === 0) return;

                itemsToAppend.reverse();
                masterDataArray = itemsToAppend.concat(masterDataArray);
                lastProcessedKey = newItems[newItems.length - 1].key;

                updateDashboardUI();
            })
            .catch(error => {
                console.error("데이터 로드 에러:", error);
            });
    }

    function updateDashboardUI() {
        if (masterDataArray.length === 0) return;

        // 최신 데이터 수정 완료 (masterDataArray[0].data 형식으로 수정)
        const latest = masterDataArray[0].data;
        document.getElementById('latest-temp').innerText = latest.sensors.temp + ' °C';
        document.getElementById('latest-humi').innerText = latest.sensors.humi + ' %';
        document.getElementById('latest-cds').innerText = latest.sensors.cds;
        document.getElementById('latest-gas').innerText = latest.sensors.gas;

        const tableBody = document.getElementById('data-table-body');
        tableBody.innerHTML = '';

        masterDataArray.forEach((wrapper, index) => {
            const item = wrapper.data;
            const row = document.createElement('tr');
            
            if (index >= 10 && !isExpanded) {
                row.classList.add('hidden-row');
            }

            const ledBadge = item.status.led === 1 ? '<span class="badge badge-on">ON</span>' : '<span class="badge badge-off">OFF</span>';
            const relayBadge = item.status.relay === 1 ? '<span class="badge badge-on">ON</span>' : '<span class="badge badge-off">OFF</span>';
            const uptimeSec = (item.uptime / 1000).toFixed(1) + 's';

            row.innerHTML = `
                <td><strong>${item.device_id}</strong></td>
                <td>${uptimeSec}</td>
                <td>${item.vcc}V</td>
                <td>${item.sensors.temp}°C</td>
                <td>${item.sensors.humi}%</td>
                <td>${item.sensors.cds}</td>
                <td>${item.sensors.gas}</td>
                <td>${ledBadge}</td>
                <td>${relayBadge}</td>
            `;
            tableBody.appendChild(row);
        });

        const toggleBtn = document.getElementById('toggle-list-btn');
        if (masterDataArray.length <= 10) {
            toggleBtn.style.display = 'none';
        } else {
            toggleBtn.style.display = 'block';
        }
    }

    function toggleListVisibility() {
        isExpanded = !isExpanded;
        const toggleBtn = document.getElementById('toggle-list-btn');
        const rows = document.querySelectorAll('#data-table-body tr');

        if (isExpanded) {
            rows.forEach(row => row.classList.remove('hidden-row'));
            toggleBtn.innerText = '접기 (10개만 보기)';
        } else {
            rows.forEach((row, index) => {
                if (index >= 10) row.classList.add('hidden-row');
            });
            toggleBtn.innerText = '전체 보기';
        }
    }
</script>
</body>
</html>
